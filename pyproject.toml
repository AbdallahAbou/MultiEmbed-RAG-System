[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "multiembed-rag"
version = "0.2.0"
description = "Multi-level embedding RAG system"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Abdallah Abouabdallah", email = "abdallah.abouabdallah.bmt@gmail.com"}
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
